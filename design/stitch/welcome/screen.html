<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Ambient Glows and Particle Fields */
        .ambient-glow {
            background: radial-gradient(circle at 50% 50%, rgba(124, 92, 255, 0.15) 0%, rgba(18, 19, 24, 0) 70%);
        }
        
        .particle-bg {
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.1) 0.5px, transparent 1px),
                radial-gradient(circle at 85% 75%, rgba(255, 255, 255, 0.15) 0.5px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(103, 213, 240, 0.05) 1px, transparent 1.5px);
            background-size: 100px 100px, 120px 120px, 80px 80px;
        }

        .glass-panel {
            background: rgba(26, 27, 32, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(202, 190, 255, 0.1);
            border-left: 1px solid rgba(202, 190, 255, 0.05);
        }

        .luminous-stroke {
            position: relative;
        }
        .luminous-stroke::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(202, 190, 255, 0.3) 0%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn-glow {
            box-shadow: 0 0 20px rgba(124, 92, 255, 0.2);
            transition: all 0.5s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(124, 92, 255, 0.4);
            color: #ecc071; /* Memory Gold on hover */
        }
